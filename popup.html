<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 360px; font: 14px system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 8px; }
    textarea { width: 100%; box-sizing: border-box; resize: vertical; }
    button { margin-top: 8px; padding: 6px 12px; cursor: pointer; }
    #answer { white-space: pre-wrap; margin-top: 10px; }
    .sources a { display: block; font-size: 12px; color: #1a73e8; margin-top: 4px; }
    .muted { color: #888; font-size: 12px; }
    .err { color: #c5221f; }
  </style>
</head>
<body>
  <h1>Ask Google AI Mode</h1>
  <textarea id="q" rows="3" placeholder="Ask anything..."></textarea>
  <button id="go">Ask</button>
  <div id="status" class="muted"></div>
  <div id="answer"></div>
  <div id="sources" class="sources"></div>
  <script src="popup.js"></script>
</body>
</html>
